[versions]
kotlin = "2.4.0"
composeMultiplatform = "1.12.0"
composeMaterial3 = "1.12.0-alpha03"
jvmTarget = "17"
jdkToolchain = "21"

# Library deps (from upstream CS3)
androidxAnnotation = "1.10.0"
jacksonModuleKotlin = "2.13.1"
jsoup = "1.22.1"
ksoup = "0.2.6"
nicehttp = "0.4.18"
rhino = "1.8.1"
kotlinxCoroutines = "1.11.0"
kotlinxSerializationJson = "1.11.0"
kotlinxDatetime = "0.8.0"
kotlinxAtomicfu = "0.33.0"
kotlinxIOCore = "0.9.1"
ktor = "3.5.0"
newpipeextractor = "v0.26.3"
cryptography = "0.6.0"
juniversalchardet = "2.5.0"
buildkonfig = "0.21.2"

# Desktop-only deps
vlcj = "4.10.1"
javafx = "21.0.5"
dex2jar = "3.0.0"
okhttp = "4.12.0"
kotlinxCollectionsImmutable = "0.3.7"
coroutinesSwing = "1.11.0"
logback = "1.5.12"
coilCompose = "3.3.0"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutinesSwing" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "kotlinxAtomicfu" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinxIOCore" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinxCollectionsImmutable" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

# CS3 library deps
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jacksonModuleKotlin" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
ksoup = { module = "com.fleeksoft.ksoup:ksoup", version.ref = "ksoup" }
nicehttp = { module = "com.github.Blatzar:nicehttp", version.ref = "nicehttp" }
rhino = { module = "org.mozilla:rhino", version.ref = "rhino" }
ktor-http = { module = "io.ktor:ktor-http", version.ref = "ktor" }
newpipeextractor = { module = "com.github.TeamNewPipe:NewPipeExtractor", version.ref = "newpipeextractor" }
cryptography-core = { module = "dev.whyoleg.cryptography:cryptography-core", version.ref = "cryptography" }
cryptography-jdk = { module = "dev.whyoleg.cryptography:cryptography-provider-jdk", version.ref = "cryptography" }
juniversalchardet = { module = "com.googlecode.juniversalchardet:juniversalchardet", version.ref = "juniversalchardet" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

# Desktop app deps
vlcj = { module = "uk.co.caprica:vlcj", version.ref = "vlcj" }
# Coil 3 for Compose Desktop image loading (posters, backdrops)
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coilCompose" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coilCompose" }
# Note: dex2jar is NOT a Maven artifact. It's bundled as a CLI tool in
# app/resources/dex-tools/ (downloaded by scripts/fetch-dex-tools.sh).
# PluginLoader.kt invokes it as a subprocess when loading .cs3 plugins.
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
buildkonfig = { id = "com.codingfeline.buildkonfig", version.ref = "buildkonfig" }

[bundles]
cryptography = ["cryptography-core", "cryptography-jdk"]
